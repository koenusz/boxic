name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.1"
          otp-version: "28.1"

      - name: Install dependencies
        run: mix deps.get

      - name: Verify vendored TCK pin
        run: bash scripts/verify_tck_pin.sh

      - name: Format check
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test

      - name: Core TCK profile
        run: mix tck --profile core --report artifacts/tck-results.csv
