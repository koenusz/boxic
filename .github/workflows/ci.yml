name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup latest supported Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.0"
          otp-version: "29.0.1"

      - name: Install dependencies
        run: mix deps.get

      - name: Verify package licenses
        run: bash scripts/verify_license_files.sh

      - name: Verify vendored TCK pin
        run: bash scripts/verify_tck_pin.sh

      - name: Format check
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: _build/dev/*.plt*
          key: dialyzer-${{ runner.os }}-otp-29.0.1-elixir-1.20.0-${{ hashFiles('mix.lock') }}

      - name: Dialyzer
        run: mix dialyzer

      - name: Hex dependency retirement audit
        run: mix hex.audit

      - name: Unit tests
        run: mix cmd mix test

      - name: Coverage
        run: |
          cd apps/boxic_feel && mix test --cover
          cd ../boxic_dmn && mix test --cover

      - name: Build documentation
        run: |
          cd apps/boxic_feel && mix docs --warnings-as-errors
          cd ../boxic_dmn && mix docs --warnings-as-errors

      - name: Build and inspect Hex packages
        run: |
          mix run scripts/build_hex_package.exs boxic_feel /tmp/boxic_feel.tar
          mix run scripts/build_hex_package.exs boxic_dmn /tmp/boxic_dmn.tar
          mix run scripts/inspect_hex_package.exs boxic_feel /tmp/boxic_feel.tar
          mix run scripts/inspect_hex_package.exs boxic_dmn /tmp/boxic_dmn.tar

      - name: Test Hex packages as clean consumers
        run: |
          mix run scripts/smoke_test_hex_packages.exs \
            /tmp/boxic_feel.tar /tmp/boxic_dmn.tar

      - name: Generate strict compatibility reports
        run: |
          mix tck --suite feel --profile implemented --report artifacts/feel-implemented --format json
          mix tck --suite dmn --profile implemented --report artifacts/dmn-implemented --format json

      - name: Enforce compatibility regression gates (18 Java cases expected for FEEL)
        run: |
          mix run scripts/check_tck_regression.exs compatibility/feel-implemented-0dbcaf9b.json artifacts/feel-implemented
          mix run scripts/check_tck_regression.exs compatibility/dmn-implemented-0dbcaf9b.json artifacts/dmn-implemented

      - name: Retain compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-reports-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  supported-runtimes:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.20.0"
            otp: "27.3"
          - elixir: "1.20.0"
            otp: "29.0.1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run application tests
        run: |
          cd apps/boxic_feel && mix test
          cd ../boxic_dmn && mix test
